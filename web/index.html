<!DOCTYPE html>
<html>

<head>


  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Locnet">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Locnet">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Locnet</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading screen — в духе приложения (surface, primary) */
    #flutter_loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FCFDFF;
      z-index: 9999;
    }

    #flutter_loading .loading_content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    #flutter_loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #E8EDF4;
      border-top-color: #1D4ED8;
      border-radius: 50%;
      animation: flutter_loading_spin 0.9s linear infinite;
    }

    #flutter_loading .label {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      color: #475569;
      letter-spacing: 0.02em;
    }

    @keyframes flutter_loading_spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="flutter_loading">
    <div class="loading_content">
      <div class="spinner" aria-hidden="true"></div>
      <span class="label">Загрузка…</span>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
